replicaCount: 2

image:
  repository: nginxinc/nginx-unprivileged
  tag: "1.27-alpine"
  pullPolicy: IfNotPresent

containerPort: 8080

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 50

probes:
  readiness:
    path: /
    initialDelaySeconds: 2
    periodSeconds: 5
  liveness:
    path: /
    initialDelaySeconds: 5
    periodSeconds: 10

content: |
  <!doctype html>
  <html>
  <head><title>Payments Platform PoC (Helm)</title></head>
  <body>
    <h1>payments-platform-poc</h1>
    <p>Delivered via Helm chart. Non-root, read-only rootfs.</p>
  </body>
  </html>

# Server config for the demo workload. Rendered into the ConfigMap and mounted
# read-only at /etc/nginx/conf.d/default.conf, replacing the base image's default
# server block — so it stays compatible with readOnlyRootFilesystem: true.
nginxConf: |
  server {
      listen       8080;
      listen  [::]:8080;
      server_name  localhost;

      # Don't advertise the nginx version in the Server header.
      server_tokens off;

      # Security response headers, closing the OWASP ZAP baseline findings.
      # `always` so they are emitted on error responses too, not just 2xx/3xx —
      # the baseline scan checks those as well.
      add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Cross-Origin-Embedder-Policy "require-corp" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header Referrer-Policy "no-referrer" always;

      location / {
          root   /usr/share/nginx/html;
          index  index.html index.htm;
      }

      error_page   500 502 503 504  /50x.html;
      location = /50x.html {
          root   /usr/share/nginx/html;
      }
  }
