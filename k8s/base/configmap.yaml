apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-app-content
data:
  index.html: |
    <!doctype html>
    <html>
    <head><title>Payments Platform PoC</title></head>
    <body>
      <h1>payments-platform-poc</h1>
      <p>nginx-unprivileged, non-root, read-only rootfs, delivered via Kustomize.</p>
      <p>Pod: ${HOSTNAME}</p>
    </body>
    </html>

  # Server config for the demo workload. Mounted read-only at
  # /etc/nginx/conf.d/default.conf, replacing the base image's default server
  # block — so it stays compatible with readOnlyRootFilesystem: true.
  default.conf: |
    server {
        listen       8080;
        listen  [::]:8080;
        server_name  localhost;

        # Don't advertise the nginx version in the Server header.
        server_tokens off;

        # Security response headers, closing the OWASP ZAP baseline findings.
        # `always` so they are emitted on error responses too, not just 2xx/3xx —
        # the baseline scan checks those as well.
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
